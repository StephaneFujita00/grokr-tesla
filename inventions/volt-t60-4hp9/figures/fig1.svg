<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="0" y="0" width="800" height="600" fill="#ffffff"/>
  <!-- Microcontroller -->
  <rect x="50" y="200" width="120" height="180" fill="none" stroke="#111" stroke-width="2"/>
  <text x="110" y="230" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">MCU (10)</text>
  <!-- Timer 1 output -->
  <line x1="170" y1="250" x2="220" y2="250" stroke="#111" stroke-width="2"/>
  <text x="195" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10">PWM1</text>
  <!-- Timer 2 output -->
  <line x1="170" y1="300" x2="220" y2="300" stroke="#111" stroke-width="2"/>
  <text x="195" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10">PWM2</text>
  <!-- MOSFET 12 -->
  <rect x="240" y="220" width="60" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="270" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">MOSFET (12)</text>
  <!-- MOSFET 14 -->
  <rect x="240" y="320" width="60" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="270" y="355" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">MOSFET (14)</text>
  <!-- Sense resistor 16 -->
  <rect x="340" y="240" width="40" height="20" fill="none" stroke="#111" stroke-width="2"/>
  <text x="360" y="235" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">R_sense (16)</text>
  <!-- LED string 18 -->
  <line x1="400" y1="250" x2="480" y2="250" stroke="#111" stroke-width="2"/>
  <rect x="480" y="230" width="80" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="520" y="255" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">LED string (18)</text>
  <!-- Supply line -->
  <line x1="340" y1="200" x2="340" y2="240" stroke="#111" stroke-width="2"/>
  <text x="340" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">V_supply</text>
  <!-- ADC lines -->
  <line x1="320" y1="280" x2="200" y2="320" stroke="#111" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="250" y="310" font-family="Helvetica, Arial, sans-serif" font-size="9">ADC (20)</text>
  <line x1="480" y1="280" x2="200" y2="340" stroke="#111" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="300" y="340" font-family="Helvetica, Arial, sans-serif" font-size="9">ADC (22)</text>
  <!-- Parallel connection -->
  <line x1="300" y1="280" x2="300" y2="350" stroke="#111" stroke-width="2"/>
  <line x1="300" y1="350" x2="340" y2="350" stroke="#111" stroke-width="2"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
  <!-- Leader to MCU -->
  <line x1="110" y1="380" x2="110" y2="400" stroke="#111" stroke-width="1"/>
  <text x="110" y="415" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Body control MCU</text>
</svg>