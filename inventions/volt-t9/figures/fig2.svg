<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#FFFFFF"/>
<!-- Vehicle underbody full outline with hatching -->
<rect x="40" y="90" width="720" height="100" fill="none" stroke="#111" stroke-width="2"/>
<line x1="50" y1="100" x2="750" y2="180" stroke="#111" stroke-width="0.5"/>
<line x1="50" y1="180" x2="750" y2="100" stroke="#111" stroke-width="0.5"/>
<text x="280" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12">Underbody rail (52)</text>
<!-- Rear liftgate area full -->
<rect x="640" y="40" width="120" height="170" fill="none" stroke="#111" stroke-width="2"/>
<text x="650" y="35" font-family="Helvetica, Arial, sans-serif" font-size="11">Liftgate (50)</text>
