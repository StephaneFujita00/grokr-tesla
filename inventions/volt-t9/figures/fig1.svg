<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <!-- Coaxial cable cross section left side -->
  <rect x="50" y="220" width="280" height="160" fill="none" stroke="#111" stroke-width="2"/>
  <text x="60" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14">Coaxial cable (12)</text>
  <!-- Center conductor -->
  <line x1="60" y1="300" x2="320" y2="300" stroke="#111" stroke-width="8"/>
  <text x="180" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11">Center conductor (16) 0.8 mm dia</text>
  <!-- Dielectric -->
  <rect x="70" y="270" width="240" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="140" y="265" font-family="Helvetica, Arial, sans-serif" font-size="11">Dielectric (34) 2.8 mm OD</text>
  <!-- Braid shield -->
  <rect x="65" y="265" width="250" height="70" fill="none" stroke="#111" stroke-width="3"/>
  <text x="130" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11">Braided shield (26) 95% coverage</text>
  <!-- Outer jacket -->
  <rect x="55" y="255" width="270" height="90" fill="none" stroke="#111" stroke-width="2"/>
  <text x="120" y="375" font-family="Helvetica, Arial, sans-serif" font-size="11">Jacket (36) 1.0 mm wall</text>
  <!-- Connector housing right side -->
  <rect x="340" y="180" width="420" height="240" fill="none" stroke="#111" stroke-width="2"/>
  <text x="450" y="170" font-family="Helvetica, Arial, sans-serif" font-size="14">Connector housing (24)</text>
  <!-- PCB inside -->
  <rect x="380" y="220" width="200" height="120" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11">PCB (22)</text>
  <!-- Inductor -->
  <rect x="400" y="250" width="30" height="20" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="395" y="285" font-family="Helvetica, Arial, sans-serif" font-size="10">L (18) 1.5 nH</text>
  <!-- Capacitor -->
  <rect x="480" y="280" width="25" height="15" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="470" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10">C (20) 22 pF</text>
  <!-- Ground plane -->
  <line x1="380" y1="320" x2="580" y2="320" stroke="#111" stroke-width="3"/>
  <text x="450" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10">Ground plane (44)</text>
  <!-- Solder fillet to shell -->
  <line x1="340" y1="300" x2="380" y2="300" stroke="#111" stroke-width="4"/>
  <text x="300" y="295" font-family="Helvetica, Arial, sans-serif" font-size="10">Solder fillet (46)</text>
  <!-- Shell outline -->
  <rect x="335" y="175" width="430" height="250" fill="none" stroke="#111" stroke-width="3"/>
  <text x="520" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11">Shell (28) zinc-nickel</text>
  <!-- Mating face contacts -->
  <line x1="760" y1="240" x2="780" y2="240" stroke="#111" stroke-width="3"/>
  <line x1="760" y1="260" x2="780" y2="260" stroke="#111" stroke-width="3"/>
  <line x1="760" y1="280" x2="780" y2="280" stroke="#111" stroke-width="3"/>
  <line x1="760" y1="300" x2="780" y2="300" stroke="#111" stroke-width="3"/>
  <text x="700" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10">Mating contacts (48)</text>
  <!-- Strain relief boot -->
  <path d="M320 255 Q340 240 360 255" fill="none" stroke="#111" stroke-width="2"/>
  <path d="M320 315 Q340 330 360 315" fill="none" stroke="#111" stroke-width="2"/>
  <text x="280" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10">Boot (38)</text>
  <!-- Leader lines to numerals -->
  <line x1="200" y1="300" x2="200" y2="380" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="300" x2="450" y2="360" stroke="#111" stroke-width="1"/>
  <line x1="520" y1="200" x2="520" y2="150" stroke="#111" stroke-width="1"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>