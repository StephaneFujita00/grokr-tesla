<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Infotainment CPU box -->
  <rect x="50" y="50" width="300" height="200" fill="none" stroke="#111" stroke-width="2"/>
  <text x="200" y="75" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Infotainment CPU</text>
  <!-- Core 3 box -->
  <rect x="70" y="90" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="130" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Core 3</text>
  <!-- Watchdog task (20) -->
  <rect x="80" y="100" width="100" height="30" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="120" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Watchdog task (20)</text>
  <!-- Camera feed thread (24) -->
  <rect x="210" y="90" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="270" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Camera feed thread (24)</text>
  <!-- Heartbeat counter (22) -->
  <rect x="230" y="160" width="80" height="25" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="270" y="177" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Heartbeat (22)</text>
  <!-- Gear position sensor (26) -->
  <rect x="400" y="120" width="140" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="470" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Gear position sensor (26)</text>
  <!-- Camera pipeline (28) -->
  <rect x="50" y="300" width="200" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="325" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Camera pipeline (28)</text>
  <text x="150" y="345" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">MIPI CSI-2 input</text>
  <!-- Rear camera icon -->
  <rect x="600" y="300" width="80" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="640" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Rear camera</text>
  <!-- Leader lines -->
  <line x1="130" y1="130" x2="270" y2="130" stroke="#111" stroke-width="1.5"/>
  <line x1="270" y1="160" x2="270" y2="185" stroke="#111" stroke-width="1.5"/>
  <line x1="470" y1="145" x2="320" y2="145" stroke="#111" stroke-width="1.5"/>
  <line x1="250" y1="340" x2="600" y2="340" stroke="#111" stroke-width="1.5"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>