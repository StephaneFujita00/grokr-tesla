<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<rect width="800" height="600" fill="#fff"/>
<!-- Battery pack outline -->
<rect x="50" y="100" width="200" height="300" fill="none" stroke="#111" stroke-width="2"/>
<text x="150" y="420" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Battery Pack</text>
<!-- Positive rail -->
<line x1="250" y1="150" x2="350" y2="150" stroke="#111" stroke-width="3"/>
<!-- Main contactor (10) -->
<rect x="350" y="120" width="80" height="60" fill="none" stroke="#111" stroke-width="2"/>
<line x1="350" y1="150" x2="430" y2="150" stroke="#111" stroke-width="3"/>
<text x="390" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11">Main Contactor (10)</text>
<!-- Voltage sensor (12) across poles -->
<line x1="360" y1="110" x2="360" y2="80" stroke="#111" stroke-width="1"/>
<line x1="420" y1="110" x2="420" y2="80" stroke="#111" stroke-width="1"/>
<line x1="360" y1="80" x2="420" y2="80" stroke="#111" stroke-width="1"/>
<text x="390" y="70" font-family="Helvetica, Arial, sans-serif" font-size="10">Voltage Sensor (12)</text>
<!-- Solid-state relay (16) -->
<rect x="500" y="120" width="60" height="60" fill="none" stroke="#111" stroke-width="2"/>
<line x1="430" y1="150" x2="500" y2="150" stroke="#111" stroke-width="3"/>
<text x="530" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10">SSR (16)</text>
<!-- Load side to inverter -->
<line x1="560" y1="150" x2="650" y2="150" stroke="#111" stroke-width="3"/>
<rect x="650" y="100" width="100" height="100" fill="none" stroke="#111" stroke-width="2"/>
<text x="700" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10">Inverter</text>
<!-- Redundant sensor (18) -->
<line x1="560" y1="170" x2="560" y2="200" stroke="#111" stroke-width="1"/>
<line x1="650" y1="170" x2="650" y2="200" stroke="#111" stroke-width="1"/>
<line x1="560" y1="200" x2="650" y2="200" stroke="#111" stroke-width="1"/>
<text x="605" y="215" font-family="Helvetica, Arial, sans-serif" font-size="10">Redundant Sensor (18)</text>
<!-- Current sensor (20) -->
<circle cx="300" cy="150" r="15" fill="none" stroke="#111" stroke-width="2"/>
<text x="300" y="155" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">I</text>
<text x="300" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10">Current Sensor (20)</text>
<!-- Controller (14) box -->
<rect x="300" y="300" width="200" height="80" fill="none" stroke="#111" stroke-width="2"/>
<text x="400" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Controller (14)</text>
<!-- Connection lines to controller -->
<line x1="390" y1="180" x2="390" y2="300" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
<line x1="530" y1="180" x2="450" y2="300" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
<line x1="300" y1="165" x2="350" y2="300" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
<line x1="605" y1="200" x2="480" y2="300" stroke="#111" stroke-width="1" stroke-dasharray="4"/>
<!-- Hatching on contactor section -->
<defs>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8">
<line x1="0" y1="8" x2="8" y2="0" stroke="#111" stroke-width="0.5"/>
</pattern>
</defs>
<rect x="360" y="130" width="60" height="40" fill="url(#hatch)" stroke="#111" stroke-width="1"/>
<!-- Caption -->
<text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>