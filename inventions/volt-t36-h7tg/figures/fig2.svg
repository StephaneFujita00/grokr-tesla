<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<rect width="800" height="600" fill="#fff"/>
<!-- Timing axes -->
<line x1="100" y1="100" x2="100" y2="500" stroke="#111" stroke-width="2"/>
<line x1="100" y1="500" x2="700" y2="500" stroke="#111" stroke-width="2"/>
<!-- Time labels -->
<text x="100" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">0</text>
<text x="250" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">10 ms</text>
<text x="400" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">50 ms</text>
<text x="550" y="530" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">100 ms</text>
<text x="50" y="300" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" transform="rotate(-90 50 300)">Voltage (V)</text>
<text x="400" y="570" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Time</text>
<!-- Voltage trace main contactor command -->
<line x1="100" y1="200" x2="200" y2="200" stroke="#111" stroke-width="2"/>
<line x1="200" y1="200" x2="200" y2="400" stroke="#111" stroke-width="2"/>
<line x1="200" y1="400" x2="700" y2="400" stroke="#111" stroke-width="2"/>
<text x="150" y="180" font-family="Helvetica, Arial, sans-serif" font-size="10">Command close</text>
<!-- Voltage differential trace -->
<line x1="100" y1="250" x2="200" y2="250" stroke="#111" stroke-width="2" stroke-dasharray="4"/>
<line x1="200" y1="250" x2="250" y2="250" stroke="#111" stroke-width="2" stroke-dasharray="4"/>
<line x1="250" y1="250" x2="250" y2="420" stroke="#111" stroke-width="2" stroke-dasharray="4"/>
<line x1="250" y1="420" x2="700" y2="420" stroke="#111" stroke-width="2" stroke-dasharray="4"/>
<text x="300" y="240" font-family="Helvetica, Arial, sans-serif" font-size="10">Voltage diff (12) >2V at 10ms</text>
<!-- Current trace -->
<line x1="100" y1="300" x2="200" y2="300" stroke="#111" stroke-width="2"/>
<line x1="200" y1="300" x2="250" y2="300" stroke="#111" stroke-width="2"/>
<line x1="250" y1="300" x2="250" y2="480" stroke="#111" stroke-width="2"/>
<line x1="250" y1="480" x2="700" y2="480" stroke="#111" stroke-width="2"/>
<text x="350" y="290" font-family="Helvetica, Arial, sans-serif" font-size="10">Current (20) no rise in 50ms</text>
<!-- SSR activation marker -->
<line x1="300" y1="150" x2="300" y2="500" stroke="#111" stroke-width="1" stroke-dasharray="2"/>
<text x="320" y="160" font-family="Helvetica, Arial, sans-serif" font-size="10">SSR (16) on at 5ms</text>
<!-- Failure label -->
<text x="400" y="100" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Failure declared at 50 ms</text>
<!-- Caption -->
<text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
<!-- Numerals overlay on traces -->
<text x="220" y="270" font-family="Helvetica, Arial, sans-serif" font-size="9">(12)</text>
<text x="220" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9">(20)</text>
<text x="320" y="180" font-family="Helvetica, Arial, sans-serif" font-size="9">(16)</text>
</svg>