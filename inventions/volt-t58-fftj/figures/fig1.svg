<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="600" fill="#fff"/>
<!-- Road and intersection context -->
<rect x="50" y="280" width="700" height="80" fill="none" stroke="#111" stroke-width="2"/>
<line x1="400" y1="280" x2="400" y2="360" stroke="#111" stroke-width="2" stroke-dasharray="8,4"/>
<line x1="100" y1="320" x2="350" y2="320" stroke="#111" stroke-width="4"/>
<line x1="450" y1="320" x2="700" y2="320" stroke="#111" stroke-width="4"/>
<!-- Turn only lane marking -->
<text x="120" y="310" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">TURN ONLY</text>
<!-- Stop line and sign -->
<line x1="380" y1="280" x2="420" y2="280" stroke="#111" stroke-width="4"/>
<polygon points="200,220 215,200 230,220 215,240" fill="none" stroke="#111" stroke-width="2"/>
<text x="205" y="225" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">STOP</text>
<!-- Traffic light -->
<rect x="480" y="200" width="30" height="70" fill="none" stroke="#111" stroke-width="2"/>
<circle cx="495" cy="215" r="6" fill="none" stroke="#111" stroke-width="2"/>
<circle cx="495" cy="235" r="6" fill="none" stroke="#111" stroke-width="2"/>
<circle cx="495" cy="255" r="6" fill="none" stroke="#111" stroke-width="2"/>
<!-- Controller box with internal modules -->
<rect x="520" y="80" width="240" height="180" fill="none" stroke="#111" stroke-width="2"/>
<text x="530" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">controller (20)</text>
<text x="530" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">firmware (22)</text>
<!-- Sub modules inside controller -->
<rect x="535" y="125" width="90" height="25" fill="none" stroke="#111" stroke-width="1"/>
<text x="540" y="142" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">lane classifier (30)</text>
<rect x="535" y="155" width="90" height="25" fill="none" stroke="#111" stroke-width="1"/>
<text x="540" y="172" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">stop verifier (42)</text>
<rect x="635" y="125" width="110" height="25" fill="none" stroke="#111" stroke-width="1"/>
<text x="640" y="142" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">yellow handler (46)</text>
<rect x="635" y="155" width="110" height="25" fill="none" stroke="#111" stroke-width="1"/>
<text x="640" y="172" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">speed limit (52)</text>
<!-- Input lines and leaders from sensors -->
<line x1="350" y1="320" x2="520" y2="150" stroke="#111" stroke-width="1"/>
<text x="380" y="240" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">lane (26)/sign (28)</text>
<line x1="495" y1="270" x2="520" y2="180" stroke="#111" stroke-width="1"/>
<text x="470" y="260" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">signal (28)</text>
<line x1="215" y1="240" x2="520" y2="165" stroke="#111" stroke-width="1"/>
<text x="300" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">stop sign (28)</text>
<line x1="100" y1="320" x2="520" y2="140" stroke="#111" stroke-width="1"/>
<text x="200" y="280" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">map (32)</text>
<!-- Wheel speed sensor -->
<circle cx="300" cy="400" r="15" fill="none" stroke="#111" stroke-width="2"/>
<text x="275" y="420" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">wheel sensor (40)</text>
<line x1="300" y1="385" x2="535" y2="167" stroke="#111" stroke-width="1"/>
<text x="380" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">velocity (40)</text>
<!-- GPS -->
<circle cx="600" cy="400" r="12" fill="none" stroke="#111" stroke-width="2"/>
<text x="575" y="420" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">GPS (48)</text>
<line x1="600" y1="388" x2="635" y2="167" stroke="#111" stroke-width="1"/>
<!-- Override and output paths -->
<line x1="635" y1="142" x2="400" y2="280" stroke="#111" stroke-width="1.5"/>
<text x="480" y="200" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">override (38)</text>
<line x1="745" y1="142" x2="700" y2="320" stroke="#111" stroke-width="1.5"/>
<text x="720" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">brake (44)</text>
<line x1="745" y1="167" x2="700" y2="340" stroke="#111" stroke-width="1.5"/>
<text x="720" y="300" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">throttle (50)</text>
<!-- Throttle actuator box -->
<rect x="680" y="360" width="40" height="30" fill="none" stroke="#111" stroke-width="2"/>
<text x="685" y="380" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">actuator (50)</text>
<!-- Haptic warning arrow -->
<line x1="520" y1="100" x2="450" y2="50" stroke="#111" stroke-width="1"/>
<text x="400" y="45" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">haptic (60)</text>
<!-- 100 Hz loop indicator -->
<rect x="100" y="450" width="200" height="40" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
<text x="110" y="475" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">100 Hz validation loop (22)</text>
<line x1="200" y1="450" x2="520" y2="260" stroke="#111" stroke-width="1"/>
<!-- Caption -->
<text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">FIG. 1</text>
</svg>