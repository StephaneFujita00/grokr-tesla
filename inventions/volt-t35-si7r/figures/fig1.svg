<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#fff"/>
<!-- Seat bottom frame -->
<rect x="100" y="420" width="600" height="40" fill="none" stroke="#111" stroke-width="2"/>
<text x="380" y="450" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">seat bottom frame (14)</text>
<!-- Left side member -->
<rect x="120" y="100" width="20" height="320" fill="none" stroke="#111" stroke-width="2"/>
<!-- Right side member -->
<rect x="660" y="100" width="20" height="320" fill="none" stroke="#111" stroke-width="2"/>
<!-- Cross members -->
<rect x="120" y="100" width="560" height="15" fill="none" stroke="#111" stroke-width="2"/>
<rect x="120" y="405" width="560" height="15" fill="none" stroke="#111" stroke-width="2"/>
<!-- Bolts -->
<circle cx="130" cy="410" r="8" fill="none" stroke="#111" stroke-width="2"/>
<circle cx="670" cy="410" r="8" fill="none" stroke="#111" stroke-width="2"/>
<text x="100" y="395" font-family="Helvetica, Arial, sans-serif" font-size="10">M10 bolt (12)</text>
<text x="650" y="395" font-family="Helvetica, Arial, sans-serif" font-size="10">M10 bolt (12)</text>
<!-- Strain gauges left -->
<rect x="115" y="200" width="30" height="8" fill="none" stroke="#111" stroke-width="2"/>
<rect x="115" y="240" width="30" height="8" fill="none" stroke="#111" stroke-width="2"/>
<line x1="145" y1="204" x2="200" y2="180" stroke="#111" stroke-width="1"/>
<text x="205" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10">strain gauge (16)</text>
<!-- Strain gauges right -->
<rect x="655" y="200" width="30" height="8" fill="none" stroke="#111" stroke-width="2"/>
<rect x="655" y="240" width="30" height="8" fill="none" stroke="#111" stroke-width="2"/>
<line x1="655" y1="204" x2="580" y2="180" stroke="#111" stroke-width="1"/>
<text x="420" y="178" font-family="Helvetica, Arial, sans-serif" font-size="10">strain gauge (16)</text>
<!-- Leads -->
<path d="M130 248 L130 320 L400 320" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
<path d="M670 248 L670 320 L400 320" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
<!-- Microcontroller -->
<rect x="360" y="300" width="80" height="50" fill="none" stroke="#111" stroke-width="2"/>
<text x="400" y="335" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">microcontroller (20)</text>
<!-- Leader to side member -->
<line x1="130" y1="260" x2="80" y2="260" stroke="#111" stroke-width="1"/>
<text x="30" y="265" font-family="Helvetica, Arial, sans-serif" font-size="10">side member (10)</text>
<!-- Dimension line -->
<line x1="100" y1="370" x2="100" y2="410" stroke="#111" stroke-width="1"/>
<text x="60" y="395" font-family="Helvetica, Arial, sans-serif" font-size="9">40 mm</text>
<text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>