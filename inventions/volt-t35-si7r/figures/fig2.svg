<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<rect width="800" height="600" fill="#fff"/>
<!-- Block diagram style but with mechanism detail -->
<rect x="50" y="80" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
<text x="110" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">strain gauges (16)</text>
<line x1="170" y1="110" x2="220" y2="110" stroke="#111" stroke-width="2"/>
<polygon points="220,105 230,110 220,115" fill="#111"/>
<!-- ADC -->
<rect x="230" y="80" width="100" height="60" fill="none" stroke="#111" stroke-width="2"/>
<text x="280" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">24-bit ADC</text>
<line x1="330" y1="110" x2="380" y2="110" stroke="#111" stroke-width="2"/>
<polygon points="380,105 390,110 380,115" fill="#111"/>
<!-- Microcontroller -->
<rect x="390" y="60" width="140" height="100" fill="none" stroke="#111" stroke-width="2"/>
<text x="460" y="95" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">microcontroller (20)</text>
<text x="460" y="115" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">temp comp</text>
<text x="460" y="130" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">threshold logic</text>
<!-- Temp sensor -->
<rect x="410" y="170" width="80" height="30" fill="none" stroke="#111" stroke-width="2"/>
<text x="450" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">temp sensor (22)</text>
<line x1="450" y1="170" x2="450" y2="160" stroke="#111" stroke-width="1"/>
<!-- CAN output -->
<line x1="530" y1="110" x2="600" y2="110" stroke="#111" stroke-width="2"/>
<polygon points="600,105 610,110 600,115" fill="#111"/>
<rect x="610" y="80" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
<text x="670" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">CAN bus to ECU</text>
<!-- Discrete output -->
<line x1="460" y1="160" x2="460" y2="220" stroke="#111" stroke-width="2"/>
<rect x="400" y="220" width="120" height="40" fill="none" stroke="#111" stroke-width="2"/>
<text x="460" y="245" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">rework lamp / lock</text>
<!-- Calibration input -->
<rect x="50" y="300" width="150" height="50" fill="none" stroke="#111" stroke-width="2"/>
<text x="125" y="330" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">calibration master</text>
<line x1="200" y1="325" x2="390" y2="325" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
<text x="295" y="315" font-family="Helvetica, Arial, sans-serif" font-size="9">store 1800-2200 µε</text>
<text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
</svg>