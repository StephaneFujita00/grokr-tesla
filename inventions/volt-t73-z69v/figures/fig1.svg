<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- ECU housing -->
  <rect x="50" y="150" width="200" height="300" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Lighting ECU (10)</text>
  <!-- Microcontroller -->
  <rect x="70" y="180" width="80" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="110" y="215" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Microcontroller (20)</text>
  <!-- EEPROM -->
  <rect x="160" y="180" width="70" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="195" y="205" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">EEPROM (12)</text>
  <!-- PWM generator -->
  <rect x="70" y="260" width="80" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="110" y="290" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">PWM gen (22)</text>
  <!-- Sense resistor -->
  <rect x="160" y="260" width="70" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="195" y="280" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">R_sense 0.05Ω (14)</text>
  <!-- Voltage divider -->
  <rect x="70" y="330" width="80" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="110" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Divider 10kΩ (16)</text>
  <!-- Thermistor input -->
  <rect x="160" y="330" width="70" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="195" y="350" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Thermistor (18)</text>
  <!-- LED array -->
  <rect x="400" y="200" width="150" height="200" fill="none" stroke="#111" stroke-width="2"/>
  <text x="475" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Front Parking LED Array</text>
  <!-- Individual LEDs with hatching -->
  <rect x="420" y="220" width="30" height="20" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="420" y1="225" x2="450" y2="225" stroke="#111" stroke-width="0.8"/>
  <line x1="420" y1="235" x2="450" y2="235" stroke="#111" stroke-width="0.8"/>
  <rect x="470" y="220" width="30" height="20" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="470" y1="225" x2="500" y2="225" stroke="#111" stroke-width="0.8"/>
  <line x1="470" y1="235" x2="500" y2="235" stroke="#111" stroke-width="0.8"/>
  <rect x="420" y="260" width="30" height="20" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="420" y1="265" x2="450" y2="265" stroke="#111" stroke-width="0.8"/>
  <line x1="420" y1="275" x2="450" y2="275" stroke="#111" stroke-width="0.8"/>
  <rect x="470" y="260" width="30" height="20" fill="none" stroke="#111" stroke-width="1.5"/>
  <line x1="470" y1="265" x2="500" y2="265" stroke="#111" stroke-width="0.8"/>
  <line x1="470" y1="275" x2="500" y2="275" stroke="#111" stroke-width="0.8"/>
  <!-- Heatsink with hatching -->
  <rect x="420" y="310" width="110" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="425" y1="315" x2="525" y2="315" stroke="#111" stroke-width="0.7"/>
  <line x1="425" y1="325" x2="525" y2="325" stroke="#111" stroke-width="0.7"/>
  <line x1="425" y1="335" x2="525" y2="335" stroke="#111" stroke-width="0.7"/>
  <text x="475" y="365" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Heatsink</text>
  <!-- Connections -->
  <line x1="250" y1="210" x2="400" y2="210" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="285" x2="400" y2="285" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="345" x2="400" y2="345" stroke="#111" stroke-width="2"/>
  <!-- Leader lines and numerals -->
  <line x1="150" y1="140" x2="150" y2="155" stroke="#111" stroke-width="1"/>
  <text x="150" y="135" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">10</text>
  <line x1="110" y1="240" x2="110" y2="255" stroke="#111" stroke-width="1"/>
  <text x="110" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">20</text>
  <line x1="195" y1="220" x2="195" y2="235" stroke="#111" stroke-width="1"/>
  <text x="195" y="230" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">12</text>
  <line x1="195" y1="290" x2="195" y2="305" stroke="#111" stroke-width="1"/>
  <text x="195" y="300" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">14</text>
  <line x1="110" y1="360" x2="110" y2="375" stroke="#111" stroke-width="1"/>
  <text x="110" y="370" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">16</text>
  <line x1="195" y1="360" x2="195" y2="375" stroke="#111" stroke-width="1"/>
  <text x="195" y="370" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">18</text>
  <line x1="110" y1="310" x2="110" y2="325" stroke="#111" stroke-width="1"/>
  <text x="110" y="320" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">22</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>