<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Conveyor belt -->
  <rect x="50" y="450" width="700" height="30" fill="#f0f0f0" stroke="#111" stroke-width="2"/>
  <line x1="50" y1="465" x2="750" y2="465" stroke="#111" stroke-width="1" stroke-dasharray="10,5"/>
  <!-- Vehicle body outline -->
  <rect x="200" y="300" width="400" height="150" fill="#f8f8f8" stroke="#111" stroke-width="2"/>
  <!-- VIN reader -->
  <rect x="180" y="280" width="40" height="60" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
  <text x="200" y="310" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111">14</text>
  <line x1="220" y1="340" x2="220" y2="360" stroke="#111" stroke-width="1"/>
  <text x="230" y="355" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">VIN reader (14)</text>
  <!-- Overhead gantry -->
  <rect x="300" y="200" width="200" height="20" fill="#d0d0d0" stroke="#111" stroke-width="2"/>
  <!-- Vision cameras -->
  <circle cx="350" cy="240" r="15" fill="#e0e0e0" stroke="#111" stroke-width="2"/>
  <text x="350" y="244" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">24</text>
  <circle cx="450" cy="240" r="15" fill="#e0e0e0" stroke="#111" stroke-width="2"/>
  <text x="450" y="244" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">24</text>
  <!-- RFID antennas -->
  <rect x="320" y="380" width="30" height="20" fill="#c0c0c0" stroke="#111" stroke-width="2"/>
  <text x="335" y="393" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">32</text>
  <rect x="450" y="380" width="30" height="20" fill="#c0c0c0" stroke="#111" stroke-width="2"/>
  <text x="465" y="393" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">32</text>
  <!-- Controller box -->
  <rect x="600" y="150" width="120" height="80" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
  <text x="660" y="190" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111" text-anchor="middle">Controller (20)</text>
  <!-- Database icon -->
  <rect x="620" y="50" width="80" height="40" fill="#f0f0f0" stroke="#111" stroke-width="2"/>
  <text x="660" y="75" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111" text-anchor="middle">Database (22)</text>
  <line x1="660" y1="90" x2="660" y2="150" stroke="#111" stroke-width="1"/>
  <!-- Leader lines and labels -->
  <line x1="220" y1="360" x2="280" y2="400" stroke="#111" stroke-width="1"/>
  <text x="285" y="405" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">Vehicle (18)</text>
  <line x1="350" y1="255" x2="350" y2="270" stroke="#111" stroke-width="1"/>
  <text x="360" y="275" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111">Knee area scan</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle">FIG. 1</text>
</svg>