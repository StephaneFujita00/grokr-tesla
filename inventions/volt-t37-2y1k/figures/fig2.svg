<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Base frame -->
  <rect x="100" y="400" width="600" height="40" fill="#f0f0f0" stroke="#111" stroke-width="2"/>
  <!-- Hydraulic actuator -->
  <rect x="350" y="250" width="100" height="150" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
  <text x="400" y="330" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111" text-anchor="middle">40</text>
  <!-- Load cells -->
  <rect x="320" y="220" width="40" height="30" fill="#c0c0c0" stroke="#111" stroke-width="2"/>
  <text x="340" y="240" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">36</text>
  <rect x="440" y="220" width="40" height="30" fill="#c0c0c0" stroke="#111" stroke-width="2"/>
  <text x="460" y="240" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">36</text>
  <!-- Bumper fixture contact plate -->
  <rect x="280" y="180" width="240" height="20" fill="#d8d8d8" stroke="#111" stroke-width="2"/>
  <!-- Displacement sensors -->
  <line x1="300" y1="200" x2="300" y2="160" stroke="#111" stroke-width="2"/>
  <circle cx="300" cy="155" r="8" fill="#e0e0e0" stroke="#111" stroke-width="2"/>
  <text x="300" y="158" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#111" text-anchor="middle">42</text>
  <line x1="500" y1="200" x2="500" y2="160" stroke="#111" stroke-width="2"/>
  <circle cx="500" cy="155" r="8" fill="#e0e0e0" stroke="#111" stroke-width="2"/>
  <text x="500" y="158" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#111" text-anchor="middle">42</text>
  <!-- Bumper cross section (hatched) -->
  <rect x="290" y="140" width="220" height="30" fill="#f8f8f8" stroke="#111" stroke-width="2"/>
  <line x1="295" y1="145" x2="505" y2="165" stroke="#111" stroke-width="1"/>
  <line x1="295" y1="155" x2="505" y2="175" stroke="#111" stroke-width="1"/>
  <line x1="295" y1="165" x2="505" y2="145" stroke="#111" stroke-width="1"/>
  <text x="400" y="160" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111" text-anchor="middle">Bumper (38)</text>
  <!-- Reference load cell for calibration -->
  <rect x="650" y="380" width="50" height="30" fill="#e8e8e8" stroke="#111" stroke-width="2"/>
  <text x="675" y="400" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#111" text-anchor="middle">Cal (5kN)</text>
  <!-- Leader lines -->
  <line x1="400" y1="250" x2="450" y2="300" stroke="#111" stroke-width="1"/>
  <text x="455" y="305" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">Actuator (40)</text>
  <line x1="340" y1="235" x2="280" y2="280" stroke="#111" stroke-width="1"/>
  <text x="220" y="285" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">Load cell (36)</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111" text-anchor="middle">FIG. 2</text>
</svg>