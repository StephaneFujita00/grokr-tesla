<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <!-- Subframe -->
  <rect x="100" y="250" width="600" height="120" fill="none" stroke="#111" stroke-width="2"/>
  <text x="380" y="320" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111">subframe (30)</text>
  <!-- Mounting boss -->
  <rect x="350" y="200" width="100" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="365" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">boss (34)</text>
  <!-- Lateral link -->
  <rect x="200" y="150" width="400" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="340" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">lateral link (32)</text>
  <!-- Fastener bolt -->
  <line x1="400" y1="210" x2="400" y2="270" stroke="#111" stroke-width="8"/>
  <polygon points="390,210 410,210 405,195 395,195" fill="none" stroke="#111" stroke-width="2"/>
  <text x="420" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#111">fastener (36)</text>
  <!-- Tool head -->
  <rect x="370" y="80" width="60" height="110" fill="none" stroke="#111" stroke-width="2"/>
  <text x="375" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">tool (40)</text>
  <!-- Torque sensor -->
  <rect x="385" y="100" width="30" height="20" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="110" x2="430" y2="110" stroke="#111" stroke-width="1"/>
  <text x="435" y="115" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111">torque sensor (12)</text>
  <!-- Rotary encoder -->
  <circle cx="400" cy="70" r="15" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="400" y1="55" x2="400" y2="85" stroke="#111" stroke-width="1"/>
  <text x="420" y="75" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111">encoder (14)</text>
  <!-- Leader lines to numerals -->
  <line x1="400" y1="320" x2="400" y2="340" stroke="#111" stroke-width="1"/>
  <circle cx="400" cy="345" r="3" fill="#111"/>
  <line x1="450" y1="240" x2="470" y2="250" stroke="#111" stroke-width="1"/>
  <circle cx="475" cy="255" r="3" fill="#111"/>
  <line x1="430" y1="115" x2="450" y2="125" stroke="#111" stroke-width="1"/>
  <circle cx="455" cy="130" r="3" fill="#111"/>
  <line x1="420" y1="75" x2="440" y2="85" stroke="#111" stroke-width="1"/>
  <circle cx="445" cy="90" r="3" fill="#111"/>
  <!-- Controller box -->
  <rect x="550" y="50" width="120" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="565" y="85" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#111">controller (20)</text>
  <line x1="400" y1="70" x2="550" y2="80" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
  <!-- Indicator -->
  <circle cx="600" cy="150" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <text x="620" y="155" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111">indicator (24)</text>
  <line x1="600" y1="138" x2="600" y2="120" stroke="#111" stroke-width="1"/>
  <!-- Interlock relay -->
  <rect x="550" y="180" width="80" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="555" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#111">interlock (26)</text>
  <!-- RFID tag -->
  <rect x="650" y="280" width="30" height="15" fill="none" stroke="#111" stroke-width="2"/>
  <text x="655" y="310" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#111">RFID (28)</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#111" text-anchor="middle">FIG. 1</text>
</svg>