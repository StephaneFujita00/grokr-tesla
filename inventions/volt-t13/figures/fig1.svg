<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- ACU box -->
  <rect x="50" y="220" width="120" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="110" y="265" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Airbag Control Unit (20)</text>
  <!-- BCM box -->
  <rect x="300" y="200" width="180" height="120" fill="none" stroke="#111" stroke-width="2"/>
  <text x="390" y="235" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">Body Control Module (10)</text>
  <text x="390" y="255" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">CAN transceiver (12)</text>
  <text x="390" y="275" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Microcontroller (16)</text>
  <text x="390" y="295" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">CrashLock routine (14)</text>
  <!-- Latch actuators -->
  <rect x="600" y="80" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="110" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Front Left Latch (30)</text>
  <rect x="600" y="160" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Front Right Latch (32)</text>
  <rect x="600" y="240" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Rear Left Latch (34)</text>
  <rect x="600" y="320" width="100" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="650" y="350" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Rear Right Latch (36)</text>
  <!-- CAN bus line -->
  <line x1="170" y1="260" x2="300" y2="260" stroke="#111" stroke-width="2"/>
  <line x1="480" y1="260" x2="600" y2="260" stroke="#111" stroke-width="2"/>
  <!-- Branch lines to latches -->
  <line x1="650" y1="260" x2="650" y2="105" stroke="#111" stroke-width="1.5"/>
  <line x1="650" y1="260" x2="650" y2="185" stroke="#111" stroke-width="1.5"/>
  <line x1="650" y1="260" x2="650" y2="265" stroke="#111" stroke-width="1.5"/>
  <line x1="650" y1="260" x2="650" y2="345" stroke="#111" stroke-width="1.5"/>
  <!-- Leader lines and numerals -->
  <line x1="110" y1="300" x2="110" y2="340" stroke="#111" stroke-width="1"/>
  <text x="110" y="355" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">20</text>
  <line x1="390" y1="320" x2="390" y2="380" stroke="#111" stroke-width="1"/>
  <text x="390" y="395" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">10</text>
  <line x1="650" y1="370" x2="650" y2="410" stroke="#111" stroke-width="1"/>
  <text x="650" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">30-36</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 1</text>
</svg>