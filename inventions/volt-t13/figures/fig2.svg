<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Time axis -->
  <line x1="80" y1="450" x2="720" y2="450" stroke="#111" stroke-width="2"/>
  <text x="400" y="480" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Time (ms)</text>
  <!-- Acceleration trace -->
  <polyline points="80,300 200,300 220,180 240,180 260,300 720,300" fill="none" stroke="#111" stroke-width="2"/>
  <text x="150" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11">Acceleration</text>
  <!-- 5g threshold line -->
  <line x1="80" y1="180" x2="720" y2="180" stroke="#111" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="750" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10">5 g</text>
  <!-- Lock command trace -->
  <polyline points="80,380 240,380 240,200 740,200 740,380" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="160" font-family="Helvetica, Arial, sans-serif" font-size="11">Lock command (0x2A4)</text>
  <!-- Inhibit window bar -->
  <rect x="240" y="500" width="500" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="490" y="520" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">500 ms switch inhibit</text>
  <!-- Leader lines -->
  <line x1="240" y1="200" x2="240" y2="540" stroke="#111" stroke-width="1"/>
  <text x="240" y="555" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">t=0</text>
  <line x1="740" y1="200" x2="740" y2="540" stroke="#111" stroke-width="1"/>
  <text x="740" y="555" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">t=500</text>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle">FIG. 2</text>
</svg>