<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Windshield header -->
  <rect x="50" y="80" width="700" height="40" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">WINDSHIELD HEADER (32)</text>
  <!-- Base (12) -->
  <rect x="200" y="120" width="400" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">FIXED BASE (12)</text>
  <!-- Threaded boss (20) -->
  <rect x="380" y="180" width="40" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Adjustment screw (18) -->
  <line x1="400" y1="210" x2="400" y2="280" stroke="#111" stroke-width="3"/>
  <polygon points="395,280 405,280 400,295" fill="none" stroke="#111" stroke-width="2"/>
  <text x="420" y="250" font-family="Helvetica, Arial, sans-serif" font-size="10">ADJUSTMENT SCREW (18)</text>
  <!-- Strain gauge (22) -->
  <rect x="390" y="230" width="20" height="8" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="430" y="235" font-family="Helvetica, Arial, sans-serif" font-size="9">STRAIN GAUGE (22)</text>
  <!-- Pivot pin (16) -->
  <circle cx="250" cy="200" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="250" y1="188" x2="250" y2="212" stroke="#111" stroke-width="2"/>
  <text x="280" y="205" font-family="Helvetica, Arial, sans-serif" font-size="10">PIVOT PIN (16)</text>
  <!-- Carrier (14) -->
  <rect x="180" y="300" width="440" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="345" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">PIVOTING CARRIER (14)</text>
  <!-- Camera module (24) -->
  <rect x="280" y="400" width="240" height="100" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="400" cy="450" r="25" fill="none" stroke="#111" stroke-width="2"/>
  <text x="400" y="455" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">LENS</text>
  <text x="400" y="520" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">CAMERA MODULE (24)</text>
  <!-- Locating pins (26) -->
  <circle cx="320" cy="380" r="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="400" cy="380" r="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="480" cy="380" r="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="520" y="385" font-family="Helvetica, Arial, sans-serif" font-size="9">LOCATING PINS (26)</text>
  <!-- Mounting holes (28) -->
  <circle cx="220" cy="150" r="5" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="580" cy="150" r="5" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="220" y="175" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">HOLES (28)</text>
  <!-- Leader lines -->
  <line x1="400" y1="105" x2="400" y2="120" stroke="#111" stroke-width="1"/>
  <line x1="250" y1="212" x2="250" y2="300" stroke="#111" stroke-width="1"/>
  <line x1="520" y1="235" x2="410" y2="235" stroke="#111" stroke-width="1"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">FIG. 1</text>
</svg>