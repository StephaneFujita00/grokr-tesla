<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <!-- Exploded view -->
  <!-- Base exploded position -->
  <rect x="100" y="100" width="300" height="50" fill="none" stroke="#111" stroke-width="2"/>
  <text x="250" y="130" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">BASE (12)</text>
  <!-- Threaded boss detail -->
  <rect x="220" y="150" width="30" height="25" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Adjustment screw exploded -->
  <line x1="235" y1="175" x2="235" y2="250" stroke="#111" stroke-width="3"/>
  <polygon points="230,250 240,250 235,265" fill="none" stroke="#111" stroke-width="2"/>
  <text x="280" y="220" font-family="Helvetica, Arial, sans-serif" font-size="9">SCREW (18)</text>
  <!-- Strain gauge detail -->
  <rect x="225" y="200" width="20" height="6" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Pivot pin exploded -->
  <circle cx="150" cy="180" r="10" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="150" y1="170" x2="150" y2="190" stroke="#111" stroke-width="2"/>
  <text x="120" y="210" font-family="Helvetica, Arial, sans-serif" font-size="9">PIN (16)</text>
  <!-- Carrier exploded -->
  <rect x="400" y="300" width="300" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="550" y="340" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">CARRIER (14)</text>
  <!-- Boss on carrier for pivot -->
  <circle cx="450" cy="335" r="12" fill="none" stroke="#111" stroke-width="2"/>
  <!-- Camera exploded below -->
  <rect x="420" y="420" width="260" height="90" fill="none" stroke="#111" stroke-width="2"/>
  <circle cx="550" cy="465" r="20" fill="none" stroke="#111" stroke-width="2"/>
  <text x="550" y="470" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">LENS</text>
  <text x="550" y="530" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">CAMERA (24)</text>
  <!-- Locating pins on carrier -->
  <circle cx="480" cy="380" r="3" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="550" cy="380" r="3" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="620" cy="380" r="3" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Mounting holes detail -->
  <circle cx="130" cy="125" r="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="370" cy="125" r="4" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Leader lines to all numerals -->
  <line x1="250" y1="150" x2="250" y2="100" stroke="#111" stroke-width="1"/>
  <line x1="235" y1="265" x2="300" y2="265" stroke="#111" stroke-width="1"/>
  <line x1="150" y1="190" x2="150" y2="300" stroke="#111" stroke-width="1"/>
  <line x1="550" y1="380" x2="550" y2="420" stroke="#111" stroke-width="1"/>
  <line x1="450" y1="347" x2="450" y2="300" stroke="#111" stroke-width="1"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">FIG. 2</text>
</svg>