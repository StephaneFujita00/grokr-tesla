<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#ffffff"/>
  <!-- Primary board outline -->
  <rect x="50" y="80" width="220" height="180" fill="none" stroke="#111" stroke-width="2"/>
  <text x="160" y="105" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">Primary Infotainment Board (10)</text>
  <!-- Power rail line -->
  <line x1="160" y1="130" x2="160" y2="160" stroke="#111" stroke-width="2"/>
  <text x="200" y="150" font-family="Helvetica, Arial, sans-serif" font-size="10">3.3V rail (11)</text>
  <!-- Voltage supervisor -->
  <rect x="100" y="170" width="60" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="130" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Supervisor (12)</text>
  <!-- Main processor -->
  <rect x="180" y="170" width="70" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="215" y="190" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Processor (13)</text>
  <!-- Firmware task label -->
  <text x="160" y="230" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Firmware task (14)</text>
  <!-- GPIO line -->
  <line x1="215" y1="200" x2="300" y2="200" stroke="#111" stroke-width="2"/>
  <line x1="300" y1="200" x2="300" y2="280" stroke="#111" stroke-width="2"/>
  <!-- Body control module -->
  <rect x="280" y="260" width="200" height="140" fill="none" stroke="#111" stroke-width="2"/>
  <text x="380" y="285" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Body Control Module (15)</text>
  <!-- Secondary encoder -->
  <rect x="310" y="300" width="80" height="30" fill="none" stroke="#111" stroke-width="2"/>
  <text x="350" y="320" font-family="Helvetica, Arial, sans-serif" font-size="9" text-anchor="middle">Encoder (16)</text>
  <!-- GPIO label -->
  <text x="310" y="260" font-family="Helvetica, Arial, sans-serif" font-size="9">GPIO 17</text>
  <!-- Rear camera -->
  <rect x="550" y="150" width="100" height="60" fill="none" stroke="#111" stroke-width="2"/>
  <text x="600" y="185" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Rear Camera (18)</text>
  <!-- LVDS link -->
  <line x1="550" y1="180" x2="480" y2="310" stroke="#111" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="500" y="240" font-family="Helvetica, Arial, sans-serif" font-size="9">LVDS</text>
  <!-- CAN-FD bus -->
  <line x1="380" y1="340" x2="450" y2="400" stroke="#111" stroke-width="2"/>
  <text x="430" y="370" font-family="Helvetica, Arial, sans-serif" font-size="9">CAN-FD (19) ID 0x3F2</text>
  <!-- Display controller -->
  <rect x="450" y="380" width="140" height="80" fill="none" stroke="#111" stroke-width="2"/>
  <text x="520" y="410" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Display Controller (20)</text>
  <!-- Center display -->
  <rect x="620" y="400" width="120" height="70" fill="none" stroke="#111" stroke-width="2"/>
  <text x="680" y="440" font-family="Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Center Display (21)</text>
  <!-- Timer box -->
  <rect x="460" y="470" width="60" height="25" fill="none" stroke="#111" stroke-width="2"/>
  <text x="490" y="487" font-family="Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">Timer (22)</text>
  <!-- Leader lines and numerals -->
  <line x1="160" y1="160" x2="160" y2="130" stroke="#111" stroke-width="1"/>
  <line x1="130" y1="185" x2="100" y2="185" stroke="#111" stroke-width="1"/>
  <line x1="215" y1="185" x2="250" y2="185" stroke="#111" stroke-width="1"/>
  <!-- Caption -->
  <text x="400" y="580" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">FIG. 1</text>
</svg>